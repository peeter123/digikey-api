name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: digikey-api version
      description: Output of `python -c "import digikey; print(digikey.__version__)"`
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code that shows the problem
      render: python
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Full error output
      description: Include the `DigikeyApiError` status and detail. Remove client ids, secrets and tokens.
      render: text
    validations:
      required: true
